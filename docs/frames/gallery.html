<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><style>
body{width:1600px;height:780px;overflow:hidden;background:radial-gradient(1000px 500px at 50% 100%,rgba(132,84,255,.25),transparent 70%),#0d0f1a;display:flex;gap:34px;justify-content:center;padding-top:50px}
.c{width:270px;text-align:center}
.c .phone{border-radius:42px;padding:10px}.c .phone img{border-radius:33px}
h3{margin-top:26px;font-size:21px;font-weight:700}
.c p{margin-top:6px;font-size:15.5px;color:#a9aed0;line-height:1.4}
</style></head><body>
<div class="c"><div class="phone"><img src="../screenshots/live-hearing.png"></div><h3>Just talk</h3><p>Voice detection knows when you finished</p></div>
<div class="c"><div class="phone"><img src="../screenshots/live-thinking.png"></div><h3>Live progress</h3><p>See what kind of work is going on</p></div>
<div class="c"><div class="phone"><img src="../screenshots/live-speaking.png"></div><h3>Spoken replies</h3><p>Tap the orb to interrupt</p></div>
<div class="c"><div class="phone"><img src="../screenshots/confirm-card.png"></div><h3>Tap to confirm</h3><p>One action, one tap, never by voice</p></div>
<div class="c"><div class="phone"><img src="../screenshots/push-to-talk.png"></div><h3>Push-to-talk</h3><p>Up to three minutes per recording</p></div>
</body></html>
