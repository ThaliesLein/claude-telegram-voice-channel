<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><style>
body{width:1600px;height:820px;overflow:hidden;background:radial-gradient(900px 600px at 78% 40%,rgba(132,84,255,.35),transparent 70%),radial-gradient(700px 500px at 95% 95%,rgba(255,90,140,.22),transparent 70%),radial-gradient(600px 500px at 0% 0%,rgba(40,130,230,.25),transparent 70%),#0d0f1a}
.txt{position:absolute;left:90px;top:170px;width:610px}
.badge{display:inline-block;font-size:17px;font-weight:500;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#c9cdf5}
h1{font-size:64px;line-height:1.06;font-weight:800;letter-spacing:-1.5px;margin:26px 0 22px}
h1 span{background:linear-gradient(90deg,#4fa8ff,#8b6bff 55%,#ff6fa3);-webkit-background-clip:text;color:transparent}
p{font-size:23px;line-height:1.5;color:#b8bcd9}
.chips{margin-top:34px;display:flex;flex-wrap:wrap;gap:10px}
.chips div{font-size:16px;padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.06);color:#d6d9f3}
.p{position:absolute;width:300px}
.p1{left:770px;top:150px;transform:rotate(-7deg)}
.p2{left:1010px;top:70px;width:320px;z-index:2}
.p3{left:1265px;top:160px;transform:rotate(7deg)}
</style></head><body>
<div class="txt"><div class="badge">Add-on for the official Claude Code Telegram plugin</div>
<h1>Talk to <span>Claude Code</span> from your phone</h1>
<p>A Voice button in your Telegram bot opens a hands-free Mini App. Speak, hear the answer, confirm risky actions with a tap.</p>
<div class="chips"><div>Live conversation</div><div>Tap to confirm</div><div>Secret redaction</div><div>Self-hosted</div></div></div>
<div class="p p1 phone"><img src="../screenshots/live-idle.png"></div>
<div class="p p2 phone"><img src="../screenshots/live-speaking.png"></div>
<div class="p p3 phone"><img src="../screenshots/confirm-card.png"></div>
</body></html>
