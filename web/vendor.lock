# Third-party assets of Live mode (voice activity detection in the browser), pinned by checksum.
# deploy.sh downloads each file into /opt/voice/web/vendor/ and voice-web serves it under /vendor/.
# Columns: sha256, file name under /vendor/, path on the npm registry (package@version/file).
# Source: https://cdn.jsdelivr.net/npm/<path>, fallback https://unpkg.com/<path>. Both serve the files of the
# npm package unchanged; a file whose sha256 differs from this list is rejected. The files are not committed.
#
# vad-web 0.0.30 contains the JavaScript of onnxruntime-web 1.22.0, so the WebAssembly runtime next to it
# must be 1.22.0 as well. To upgrade: change the version in the path, download the file, check it against the
# package tarball on the npm registry, put its new sha256 here and run deploy.sh.
#
